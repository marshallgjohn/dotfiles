unbind C-b
set-option -g prefix C-a
bind C-a send-prefix

# Neovim-friendly: 10ms is responsive without breaking <Esc> / alt-keys.
# (0 breaks vim mode-switching; 500+ feels laggy.)
set -s escape-time 10
set -g focus-events on

# Truecolor (WezTerm) + 256color fallback
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:RGB,wezterm:RGB"

set -g mouse on
set -g history-limit 50000
setw -g mode-keys vi

# WSL clipboard: copy in tmux -> Windows clipboard via clip.exe
if-shell 'command -v clip.exe >/dev/null' {
  bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip.exe"
  bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "clip.exe"
  bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "clip.exe"
}



# DESIGN TWEAKS

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# clock mode
setw -g clock-mode-colour yellow

# copy mode
setw -g mode-style 'fg=black bg=red bold'

# panes
set -g pane-border-style 'fg=red'
set -g pane-active-border-style 'fg=yellow'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=red'

set -g status-left ''
set -g status-left-length 10

set -g status-right-style 'fg=black bg=yellow'
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50

setw -g window-status-current-style 'fg=black bg=red'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=red bg=black'
setw -g window-status-format ' #I #[fg=white]#W #[fg=yellow]#F '

setw -g window-status-bell-style 'fg=yellow bg=red bold'

# messages
set -g message-style 'fg=yellow bg=red bold'

# Plugins (tpm must stay last). Install with: ~/.tmux/plugins/tpm/bin/install_plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
run '~/.tmux/plugins/tpm/tpm'
